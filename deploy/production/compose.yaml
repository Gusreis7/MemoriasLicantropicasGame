name: memorias-production
x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  api:
    <<: *hardened
    image: ${API_IMAGE:?digest da API obrigatório}
    user: "1000:1000"
    mem_limit: 2g
    environment:
      REDIS_URL: redis://redis:6379/0
      AWS_REGION: ${AWS_REGION:?região obrigatória}
      AWS_USE_DEFAULT_CREDENTIALS: "true"
      BEDROCK_MODEL: qwen.qwen3-32b
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_ALLOWED_ORIGINS: http://localhost:7078,http://127.0.0.1:7078
      ADMIN_COOKIE_SECURE: "false"
      API_DOCS_ENABLED: "false"
      ALLOWED_HOSTS: memoriaslicantropicasgame.gustavodreis.dev.br,localhost,127.0.0.1
      SOCIAL_ENABLED: "true"
    volumes:
      - /run/ml-game/admin_password:/run/secrets/admin_password:ro
    networks:
      backend: {}
      frontend: {}
      egress: {ipv4_address: 172.30.254.2}
    depends_on: {redis: {condition: service_healthy}}
    init: true
  redis:
    <<: *hardened
    image: ${REDIS_IMAGE:?digest Redis obrigatório}
    user: "999:999"
    mem_limit: 2g
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory, 1536mb, --maxmemory-policy, noeviction]
    volumes: [/srv/ml-data/redis:/data]
    networks: [backend]
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
  game:
    <<: *hardened
    image: ${WEB_IMAGE:?digest da interface obrigatório}
    user: "101:101"
    mem_limit: 256m
    ports: ["8080:8080"]
    volumes:
      - /etc/ml-game/game.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ml-game/proxy-game.conf:/etc/nginx/proxy-game.conf:ro
    networks: [frontend]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 5s
      retries: 12
  admin:
    <<: *hardened
    image: ${WEB_IMAGE:?digest da interface obrigatório}
    user: "101:101"
    mem_limit: 128m
    ports: ["127.0.0.1:7078:8080"]
    volumes: [/etc/ml-game/admin.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [frontend]
    depends_on: {api: {condition: service_healthy}}
networks:
  backend: {internal: true}
  frontend:
    ipam:
      config: [{subnet: 172.30.253.0/28}]
  egress:
    ipam:
      config: [{subnet: 172.30.254.0/28}]
