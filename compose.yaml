x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
services:
  api:
    <<: *hardened
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_PREFIX: ${REDIS_PREFIX:-ml:v1}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      BEDROCK_BASE_URL: ${BEDROCK_BASE_URL:-}
      BEDROCK_MODEL: ${BEDROCK_MODEL:-qwen.qwen3-32b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_TURN_TIMEOUT_SECONDS: ${LLM_TURN_TIMEOUT_SECONDS:-60}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      LLM_HISTORY_LIMIT: ${LLM_HISTORY_LIMIT:-20}
      LLM_PRICING_MODEL: ${LLM_PRICING_MODEL:-qwen.qwen3-32b}
      LLM_PRICING_REGION: ${LLM_PRICING_REGION:-us-east-1}
      LLM_INPUT_USD_PER_MILLION: ${LLM_INPUT_USD_PER_MILLION:-0.15}
      LLM_OUTPUT_USD_PER_MILLION: ${LLM_OUTPUT_USD_PER_MILLION:-0.60}
      LLM_PRICING_SOURCE: ${LLM_PRICING_SOURCE:-https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrock/current/us-east-1/index.json}
      LLM_PRICING_CHECKED_AT: ${LLM_PRICING_CHECKED_AT:-2026-11-01}
      SOCIAL_ENABLED: ${SOCIAL_ENABLED:-true}
      SOCIAL_POLL_SECONDS: ${SOCIAL_POLL_SECONDS:-1}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECONDS: ${ADMIN_SESSION_SECONDS:-28800}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-http://localhost:7078,http://127.0.0.1:7078}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:7079:8000"
    init: true
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
    init: true
  game:
    <<: *hardened
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: memorias-licantropicas-web:local
    ports:
      - "127.0.0.1:7077:8080"
    volumes:
      - ./deploy/game.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
  admin:
    <<: *hardened
    image: memorias-licantropicas-web:local
    pull_policy: never
    ports:
      - "127.0.0.1:7078:8080"
    volumes:
      - ./deploy/admin.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      game:
        condition: service_started

volumes:
  redis_data:
