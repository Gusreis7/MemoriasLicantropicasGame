services:
  api:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_PREFIX: ${REDIS_PREFIX:-ml:v1}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      BEDROCK_BASE_URL: ${BEDROCK_BASE_URL:-}
      BEDROCK_MODEL: ${BEDROCK_MODEL:-qwen.qwen3-32b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      LLM_HISTORY_LIMIT: ${LLM_HISTORY_LIMIT:-20}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    init: true
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true

volumes:
  redis_data:
