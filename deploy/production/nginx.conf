worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Anonymous presence tracking must not create access-log records with IPs.
    map $uri $log_access {
        default 1;
        /api/v1/visits 0;
    }
    access_log /dev/stdout combined if=$log_access;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Apply in the image's global config, including hosts with an older mounted
    # game.conf. Security add_header directives remain inherited unchanged.
    map $uri $asset_expires {
        default off;
        / -1;
        ~^/assets/optimized/[a-f0-9]+\.webp$ 365d;
        ~^/assets/[^/]+-[A-Za-z0-9_-]+\.(js|css)$ 365d;
        ~\.(html|json|png|woff2|ogg)$ -1;
    }
    expires $asset_expires;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 16k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=dialogue:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=creation:10m rate=6r/m;
    limit_req_status 429;
    include /etc/nginx/conf.d/*.conf;
}
