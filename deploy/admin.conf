server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    location = / { try_files /admin.html =404; }
    location /admin/api/v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
    }
    location /api/ { return 404; }
    location / { try_files $uri =404; }
}
