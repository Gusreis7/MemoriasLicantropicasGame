name: ml-security-check
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
services:
  api:
    <<: *hardened
    build: ../..
    image: ml-security-api:local
    user: "1000:1000"
    environment:
      REDIS_URL: redis://redis:6379/0
      SOCIAL_ENABLED: "false"
      API_DOCS_ENABLED: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      ADMIN_PASSWORD: security-test-password-not-production
      ADMIN_ALLOWED_ORIGINS: http://localhost:17078,http://127.0.0.1:17078
    networks: [backend, frontend]
    depends_on: {redis: {condition: service_healthy}}
  redis:
    <<: *hardened
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    user: "999:1000"
    volumes: [test-data:/data]
    networks: [backend]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 2s, timeout: 2s, retries: 15}
  game:
    <<: *hardened
    build: {context: ../.., dockerfile: frontend/Dockerfile}
    image: ml-security-web:local
    user: "101:101"
    ports: ["127.0.0.1:17077:8080"]
    volumes:
      - ./game.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy-game.conf:/etc/nginx/proxy-game.conf:ro
    networks: [frontend]
    depends_on: {api: {condition: service_healthy}}
  admin:
    <<: *hardened
    image: ml-security-web:local
    user: "101:101"
    ports: ["127.0.0.1:17078:8080"]
    volumes: [../admin.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [frontend]
    depends_on: {api: {condition: service_healthy}, game: {condition: service_started}}
networks:
  backend: {internal: true}
  frontend: {}
volumes: {test-data: {}}
