server {
    listen 8080;
    server_name memoriaslicantropicasgame.gustavodreis.dev.br;
    root /usr/share/nginx/html;
    index index.html;
    # Só o SG do ALB alcança este listener. Seu último XFF é a origem real.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    location ^~ /admin { return 404; }
    location ~ ^/assets/admin- { return 404; }
    location = /health { proxy_pass http://api:8000/health; proxy_set_header Host 127.0.0.1; }
    location = /api/v1/games {
        limit_req zone=creation burst=3 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy-game.conf;
    }
    location ~ ^/api/v1/games/[a-f0-9-]+/conversations/[a-f0-9-]+/messages$ {
        limit_req zone=dialogue burst=5 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy-game.conf;
    }
    location /api/v1/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy-game.conf;
    }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
