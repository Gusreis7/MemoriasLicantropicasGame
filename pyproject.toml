[project]
name = "memorias-licantropicas"
version = "0.1.0"
description = "Jogo web de investigação e dedução social inspirado em Machado de Assis."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aws-bedrock-token-generator>=1.0,<2.0",
    "botocore[crt]>=1.41,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "langchain-core>=1,<2",
    "langgraph>=1,<2",
    "langsmith>=0.14,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.8,<3.0",
    "redis>=6.0,<8.0",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.28,<3.0",
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
