name: Validate
on:
  workflow_call:
  pull_request:
  push:
    branches: [main, develop]
permissions: {contents: read}
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with: {version: "0.13.6"}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: python3 -m unittest discover -s tests/deployment -p 'test_*.py'
      - name: Browser security checks (Chromium on CI, Brave locally)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          export BRAVE_PATH="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          npx playwright test e2e/security-deployment.spec.ts
      - name: Subir contêineres isolados para verificar o proxy
        run: docker compose -f deploy/production/compose.security-test.yaml up -d --build --wait --wait-timeout 120
      - name: Verificar CSP e isolamento do admin nos contêineres
        working-directory: frontend
        run: |
          export BRAVE_PATH="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          node e2e/security-deployed.mjs
      - name: Limpar somente a pilha de testes
        if: always()
        run: docker compose -f deploy/production/compose.security-test.yaml down -v
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: {terraform_version: "1.17.1", terraform_wrapper: false}
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/bootstrap init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra/terraform/bootstrap validate
      - run: terraform -chdir=infra/terraform/bootstrap test
      - run: terraform -chdir=infra/terraform/app init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra/terraform/app validate
      - run: terraform -chdir=infra/terraform/app test
