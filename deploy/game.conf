server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    location ^~ /admin { return 404; }
    location ~ ^/assets/admin- { return 404; }
    location /api/v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_read_timeout 140s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
