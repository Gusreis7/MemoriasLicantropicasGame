services:
  api:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_PREFIX: ${REDIS_PREFIX:-ml:v1}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      BEDROCK_BASE_URL: ${BEDROCK_BASE_URL:-}
      BEDROCK_MODEL: ${BEDROCK_MODEL:-qwen.qwen3-32b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      LLM_HISTORY_LIMIT: ${LLM_HISTORY_LIMIT:-20}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECONDS: ${ADMIN_SESSION_SECONDS:-28800}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-http://localhost:7078,http://127.0.0.1:7078}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:7079:8000"
    init: true
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true
  game:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: memorias-licantropicas-web:local
    ports:
      - "127.0.0.1:7077:80"
    volumes:
      - ./deploy/game.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
  admin:
    image: memorias-licantropicas-web:local
    pull_policy: never
    ports:
      - "127.0.0.1:7078:80"
    volumes:
      - ./deploy/admin.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      game:
        condition: service_started

volumes:
  redis_data:
